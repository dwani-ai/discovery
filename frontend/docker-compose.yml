services:
  # Production server (served via Nginx)
  discovery-ux:
    image: dwani/discovery-ux-prod:latest
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: production
      args:
        VITE_DWANI_API_BASE_URL: ${VITE_DWANI_API_BASE_URL:?Set VITE_DWANI_API_BASE_URL}
    ports:
      - "80:80"
    restart: unless-stopped
